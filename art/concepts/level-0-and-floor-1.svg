<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2160 940" role="img" aria-labelledby="title desc">
  <title id="title">Макет уровня 0 и первого подземного этажа</title>
  <desc id="desc">Два уровня по 100 на 12 клеток. На поверхности руины, дорога, вход, коридор, охрана, лестница и неработающий лифт. Ниже коридор и одна маленькая комната шириной четыре клетки с дверью два на три клетки. Через дверь открывается карточка комнаты выживания на восемь мест.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d6d0b8" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <pattern id="rock" width="80" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 22l22-10 20 8 21-7 17 5M0 50l17-7 18 8 26-12 19 5" fill="none" stroke="#88908b" stroke-opacity=".13" stroke-width="4"/>
      <circle cx="29" cy="30" r="3" fill="#89918b" opacity=".18"/>
      <circle cx="65" cy="54" r="5" fill="#89918b" opacity=".13"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#e5b46b"/></marker>
  </defs>

  <rect width="2160" height="940" fill="#1e2a30"/>
  <text x="80" y="62" fill="#eee6d5" font-family="Arial,sans-serif" font-size="36" font-weight="700">Уровень 0 и первый подземный этаж</text>
  <text x="80" y="99" fill="#aebbb9" font-family="Arial,sans-serif" font-size="21">Макет бокового разреза · одна маленькая комната · фирменный стиль «Слоистый свет»</text>
  <rect x="1710" y="36" width="370" height="76" rx="12" fill="#2d3c43" stroke="#6f8484" stroke-width="2"/>
  <text x="1734" y="69" fill="#e9c58a" font-family="Arial,sans-serif" font-size="20" font-weight="700">СЕТКА 100 × 12 НА УРОВЕНЬ</text>
  <text x="1734" y="97" fill="#d6d0bc" font-family="Arial,sans-serif" font-size="18">1 клетка = 0,8 × 0,8 м</text>

  <!-- Map: x=80..2080 gives 100 cells at 20 px; two levels of 12 rows. -->
  <rect x="80" y="160" width="2000" height="480" fill="#273238" stroke="#81908d" stroke-width="3"/>
  <rect x="80" y="160" width="2000" height="100" fill="#778583"/>
  <path d="M80 248l98-29 87 24 86-39 85 30 100-25 94 35 71-30 101 21 73-28 111 34 115-22 84 25 98-39 122 42 85-32 102 31 107-27 128 32 120-39 93 36v40H80z" fill="#53636a"/>
  <path d="M80 254l180-9 126-30 133 25 117-25 112 31 156-25 144 20 111-32 140 33 114-25 134 21 143-19 140 32 150-19v28H80z" fill="#43535a"/>
  <circle cx="1510" cy="198" r="24" fill="#ded2af"/>
  <!-- Ruined skyline and road. -->
  <g fill="#394a50" stroke="#24333b" stroke-width="4">
    <path d="M1060 249v-50h19v17h17v-38h31v34h14v37z"/>
    <path d="M1190 250v-30h17v-35h26v13h13v52z"/>
    <path d="M1380 251v-45h19v-20h29v27h20v38z"/>
    <path d="M1790 251v-58h25v19h18v-38h31v77z"/>
    <path d="M1910 251v-25h18v-43h35v24h18v44z"/>
  </g>
  <path d="M1040 252l55-12m360 12l32-9m276 9l20-13" fill="none" stroke="#b6ad94" stroke-width="5" opacity=".55"/>
  <path d="M1000 259h1080v21H1000z" fill="#756f65" stroke="#b5ad96" stroke-width="3"/>
  <path d="M1040 269h165m49 0h150m45 0h170m45 0h172m44 0h160" stroke="#d5c49f" stroke-width="3" stroke-dasharray="19 15"/>
  <path d="M180 245l25-20 17 20m51 0l16-14 10 14m147-1l26-18 20 18" fill="#37464b" stroke="#26363b" stroke-width="4"/>

  <!-- Underground layers and constructed surface corridor. -->
  <rect x="80" y="280" width="2000" height="360" fill="#303c43"/>
  <rect x="80" y="400" width="2000" height="240" fill="#344047"/>
  <path d="M80 424l96-15 72 11 78-11 105 9 69-14 97 16 72-11 98 11 110-16 102 16 87-11 103 12 102-15 100 14 104-13 103 12 79-12 80 12 121-14 100 12v220H80z" fill="#39464d"/>
  <path d="M80 477l78-21 101 14 102-10 73 20 99-12 119 19 87-22 118 16 88-17 110 14 96-20 110 18 99-13 118 19 106-15 105 16 129-19 92 16v160H80z" fill="#303d45"/>
  <rect x="80" y="280" width="2000" height="360" fill="url(#rock)"/>

  <!-- Existing entrance and level-0 corridor, x=7..38. -->
  <path d="M220 280v-24l30-20h45l22 20v24" fill="#42535b" stroke="#a9a38d" stroke-width="5"/>
  <rect x="220" y="280" width="640" height="80" fill="#746959" stroke="#9e9b89" stroke-width="7"/>
  <path d="M220 280h640M220 360h640" stroke="#c3aa7f" stroke-width="5"/>
  <path d="M300 321h190m260 0h110" stroke="#bbad91" stroke-opacity=".3" stroke-width="3"/>
  <rect x="220" y="300" width="40" height="60" rx="3" fill="#344850" stroke="#e6bb7c" stroke-width="4"/>
  <path d="M230 307v44m19-44v44" stroke="#75888a" stroke-width="3"/>
  <rect x="215" y="313" width="4" height="25" fill="#efa755"/>
  <rect x="500" y="280" width="240" height="80" fill="#8a7861" opacity=".58"/>
  <rect x="500" y="300" width="40" height="60" rx="3" fill="#344850" stroke="#d9b884" stroke-width="4"/>
  <rect x="567" y="327" width="86" height="12" fill="#43555a"/>
  <path d="M577 339v19m67-19v19" stroke="#43555a" stroke-width="6"/>
  <rect x="680" y="320" width="32" height="39" fill="#4c5d5d" stroke="#c7ad7e" stroke-width="3"/>
  <path d="M682 322l28 35m0-35l-28 35" stroke="#baa47c" stroke-width="2"/>
  <rect x="302" y="289" width="100" height="7" rx="3" fill="#dba959"/>
  <rect x="563" y="289" width="56" height="7" rx="3" fill="#dba959"/>
  <!-- Stair shaft x=33..38 and lift x=39..45. -->
  <rect x="740" y="280" width="120" height="320" fill="#536067" stroke="#a6a697" stroke-width="6"/>
  <path d="M745 350h18v16h18v16h18v16h18v16h18v16h18v16h-18v16h-18v16h-18v16h-18v16h-18v16h-18v16h18v16h18v16h18" fill="none" stroke="#d2bc95" stroke-width="6"/>
  <path d="M754 280v320m97-320v320" stroke="#253940" stroke-width="6"/>
  <rect x="860" y="280" width="140" height="320" fill="#2a4048" stroke="#9ca79e" stroke-width="6"/>
  <path d="M930 282v318m-65-15h130" stroke="#81908f" stroke-width="5"/>
  <rect x="874" y="350" width="112" height="68" fill="#33464e" stroke="#748a89" stroke-width="4"/>
  <text x="930" y="392" fill="#d9aa68" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">OFF</text>

  <!-- First underground floor: continuous corridor, x=33..73. -->
  <rect x="740" y="520" width="800" height="80" fill="#756957" stroke="#aa9d80" stroke-width="7"/>
  <path d="M740 520h800M740 600h800" stroke="#d0b081" stroke-width="5"/>
  <path d="M1000 565h530" stroke="#d7c098" stroke-opacity=".3" stroke-width="3"/>
  <rect x="760" y="531" width="65" height="7" rx="3" fill="#dcad64"/>
  <rect x="1170" y="531" width="65" height="7" rx="3" fill="#dcad64"/>
  <rect x="1380" y="531" width="65" height="7" rx="3" fill="#dcad64"/>

  <!-- One small room: x=48..51, 4 cells = 80 px; door cells 49..50 = 40 px and 3 rows. -->
  <rect x="1040" y="520" width="80" height="80" fill="#d8a75d" opacity=".18"/>
  <path d="M1040 515h80m-80-8v17m80-17v17" fill="none" stroke="#f0bf75" stroke-width="4"/>
  <rect x="1060" y="540" width="40" height="60" rx="3" fill="#3e5359" stroke="#ffd08a" stroke-width="5"/>
  <path d="M1070 548v42m19-42v42" stroke="#849395" stroke-width="3"/>
  <circle cx="1091" cy="573" r="4" fill="#f5bd6b"/>
  <rect x="1053" y="552" width="5" height="30" rx="2" fill="#f5ad59"/>
  <path d="M1080 600v66" fill="none" stroke="#efbb70" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Grid on top for scale, with level divider. -->
  <rect x="80" y="160" width="2000" height="480" fill="url(#grid)"/>
  <path d="M80 400h2000" stroke="#d2bd98" stroke-width="4"/>
  <rect x="92" y="174" width="196" height="45" rx="7" fill="#25343b" opacity=".93"/>
  <text x="108" y="204" fill="#eee3ce" font-family="Arial,sans-serif" font-size="23" font-weight="700">УРОВЕНЬ 0</text>
  <rect x="92" y="413" width="174" height="45" rx="7" fill="#25343b" opacity=".93"/>
  <text x="108" y="444" fill="#eee3ce" font-family="Arial,sans-serif" font-size="23" font-weight="700">ЭТАЖ 1</text>
  <text x="1060" y="500" fill="#f4ce92" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700">4 клетки</text>
  <text x="1032" y="685" fill="#f5c988" font-family="Arial,sans-serif" font-size="20">Дверь 2 × 3 клетки · комната 4 клетки · 8 мест</text>
  <text x="1274" y="580" fill="#d9c5a6" font-family="Arial,sans-serif" font-size="22">← свободный коридор</text>
  <text x="1555" y="580" fill="#96aaa8" font-family="Arial,sans-serif" font-size="19">дальше — место для расширения</text>
  <text x="270" y="381" fill="#e4ceb0" font-family="Arial,sans-serif" font-size="18">вход</text>
  <text x="482" y="381" fill="#e4ceb0" font-family="Arial,sans-serif" font-size="18">коридор и охрана</text>
  <text x="757" y="627" fill="#e6c58f" font-family="Arial,sans-serif" font-size="17">лестница</text>
  <text x="893" y="627" fill="#91a7a6" font-family="Arial,sans-serif" font-size="17">лифт</text>

  <!-- Bottom explanation and door card. -->
  <rect x="80" y="716" width="770" height="174" rx="13" fill="#293a42" stroke="#6e8482" stroke-width="3"/>
  <text x="110" y="756" fill="#e9c58a" font-family="Arial,sans-serif" font-size="24" font-weight="700">КАК СТРОИТСЯ</text>
  <text x="110" y="792" fill="#ece4d4" font-family="Arial,sans-serif" font-size="21">Игрок ставит только дверь и выбирает размер комнаты.</text>
  <text x="110" y="825" fill="#c8d0c8" font-family="Arial,sans-serif" font-size="21">Система показывает границы и создаёт работы по стройке.</text>
  <text x="110" y="858" fill="#c8d0c8" font-family="Arial,sans-serif" font-size="21">Оборудование и график настраиваются через дверь.</text>

  <rect x="890" y="716" width="1190" height="174" rx="13" fill="#303e42" stroke="#d0a56e" stroke-width="3"/>
  <text x="920" y="754" fill="#f1d39c" font-family="Arial,sans-serif" font-size="25" font-weight="700">Карточка маленькой комнаты · 8 / 8 мест</text>
  <text x="920" y="786" fill="#bfcac2" font-family="Arial,sans-serif" font-size="19">Комната выживания · качество +10% · уровень 0</text>
  <g font-family="Arial,sans-serif" font-size="19" fill="#eee3d1" text-anchor="middle">
    <rect x="920" y="808" width="242" height="54" rx="8" fill="#475458" stroke="#af9f82" stroke-width="2"/>
    <text x="1041" y="843">Кровать · 2 места</text>
    <rect x="1172" y="808" width="255" height="54" rx="8" fill="#40565a" stroke="#88b9b5" stroke-width="2"/>
    <text x="1299" y="843">Холодильник · 1</text>
    <rect x="1437" y="808" width="252" height="54" rx="8" fill="#5b4d3f" stroke="#e4aa68" stroke-width="2"/>
    <text x="1563" y="843">Плита · 3 места</text>
    <rect x="1699" y="808" width="351" height="54" rx="8" fill="#3b565b" stroke="#77b9bd" stroke-width="2"/>
    <text x="1874" y="843">Очиститель воды · 2 места</text>
  </g>
  <text x="80" y="922" fill="#8fa5a4" font-family="Arial,sans-serif" font-size="17">Схема для планировки: сетка и подписи видны в макете; в обычной игре сетка скрыта. Дальний фон, солнце и погода будут отдельными слоями.</text>
</svg>
