  <text x="80" y="700" fill="#aeb9b6" font-family="Arial,sans-serif" font-size="15">Концепт масштаба. Светило, погода и фон — отдельные слои; этажи ниже продолжают ту же сетку 100 × 12.</text>
</svg>
