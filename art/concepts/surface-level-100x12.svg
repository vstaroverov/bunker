  <path d="M80 143v-14m2000 14v-14M80 135h2000" fill="none" stroke="#d7b57d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1020" y="128" fill="#e9c58a" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">100 КЛЕТОК · 80 М</text>
  <path d="M61 150H48v240h13" fill="none" stroke="#d7b57d" stroke-width="2"/>
  <text x="31" y="279" fill="#e9c58a" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" transform="rotate(-90 31 279)">12 КЛЕТОК · 9,6 М</text>
  <g fill="#b3c3bf" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><text x="80" y="413">0</text><text x="280" y="413">10</text><text x="480" y="413">20</text><text x="680" y="413">30</text><text x="880" y="413">40</text><text x="1080" y="413">50</text><text x="1280" y="413">60</text><text x="1480" y="413">70</text><text x="1680" y="413">80</text><text x="1880" y="413">90</text><text x="2080" y="413">100</text></g>
