<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 720" role="img" aria-labelledby="title desc">
  <title id="title">Первый наземный уровень: сетка 100 на 12 кубиков</title>
  <desc id="desc">Слева вход в бункер, затем непрерывный коридор до лестницы и неработающего лифта. Охранная комната расположена сбоку от боевого прохода. Справа поверхность, дорога и место для будущих построек. Показаны сетка и масштабы персонажей.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#f3e5c5" stroke-opacity=".2" stroke-width="1"/></pattern>
    <pattern id="rock" width="100" height="65" patternUnits="userSpaceOnUse"><path d="M5 27l25-11 30 8 27-12M-6 55l19-9 22 4 17-9 30 7 24-9" fill="none" stroke="#66757a" stroke-opacity=".25" stroke-width="3"/></pattern>
    <clipPath id="sceneClip"><rect x="80" y="150" width="2000" height="240" rx="4"/></clipPath>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#e3b16c"/></marker>
  </defs>
  <rect width="2200" height="720" fill="#172127"/>
  <text x="80" y="64" fill="#f2e9d6" font-family="Arial,sans-serif" font-size="38" font-weight="700">ПЕРВЫЙ НАЗЕМНЫЙ УРОВЕНЬ</text>
  <text x="81" y="103" fill="#d4b383" font-family="Arial,sans-serif" font-size="23">Клетка 80 × 80 см · уровень 80 × 9,6 м · улица → вход → боевой коридор → спуск</text>

